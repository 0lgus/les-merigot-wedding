<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 1400"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Olga &amp; Ben Wedding Seating Map</title>
  <desc id="desc">Interactive-ready wedding reception seating map with tables 1 to 10, dance area, DJ stand, bar and toilets.</desc>

  <style>
    :root {
      --ivory: #f8f6f1;
      --warm-white: #fffdf9;
      --sage: #78866b;
      --sage-dark: #59654f;
      --sage-light: #e7ebe2;
      --gold: #b79a62;
      --text: #34382f;
      --muted: #70766b;
      --line: rgba(89, 101, 79, 0.42);
    }

    .bg { fill: var(--ivory); }
    .zone {
      fill: rgba(255,253,249,.55);
      stroke: var(--sage);
      stroke-width: 3;
      stroke-dasharray: 12 10;
    }
    .fixture {
      fill: var(--sage-light);
      stroke: var(--sage-dark);
      stroke-width: 3;
    }
    .table-shape {
      fill: var(--warm-white);
      stroke: var(--sage-dark);
      stroke-width: 3;
    }
    .seat {
      fill: var(--warm-white);
      stroke: var(--sage);
      stroke-width: 2.5;
      transition: fill .18s ease, stroke .18s ease, transform .18s ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .seat-label {
      fill: var(--text);
      font: 500 18px Georgia, "Times New Roman", serif;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .table-label {
      fill: var(--sage-dark);
      font: 500 30px Georgia, "Times New Roman", serif;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .fixture-label {
      fill: var(--sage-dark);
      font: 600 22px Arial, Helvetica, sans-serif;
      text-anchor: middle;
      dominant-baseline: middle;
      letter-spacing: .04em;
    }
    .dance-label {
      fill: var(--sage-dark);
      font: 500 28px Georgia, "Times New Roman", serif;
      text-anchor: middle;
    }
    .small-label {
      fill: var(--muted);
      font: 500 18px Arial, Helvetica, sans-serif;
      text-anchor: middle;
    }

    /* Classes for future website highlighting */
    .table-group.is-active .table-shape,
    .table-group.is-active .round-table {
      fill: #f4ead4;
      stroke: var(--gold);
      stroke-width: 5;
    }
    .seat.is-active {
      fill: var(--gold);
      stroke: var(--gold);
      transform: scale(1.12);
    }
    .seat.is-active + .seat-label {
      fill: white;
      font-weight: 700;
    }
  </style>

  <rect class="bg" x="0" y="0" width="1000" height="1400"/>

  <!-- Dance area -->
  <g id="dance-area">
    <rect class="zone" x="285" y="85" width="455" height="220" rx="8"/>
    <text class="dance-label" x="512" y="205">Dance Area</text>
  </g>

  <!-- DJ stand -->
