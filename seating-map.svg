    <rect class="fixture" x="790" y="250" width="60" height="115" rx="6"/>
    <circle cx="820" cy="278" r="16" fill="none" stroke="#59654f" stroke-width="3"/>
    <circle cx="820" cy="337" r="16" fill="none" stroke="#59654f" stroke-width="3"/>
    <circle cx="820" cy="278" r="5" fill="#59654f"/>
    <circle cx="820" cy="337" r="5" fill="#59654f"/>
    <circle cx="803" cy="306" r="4" fill="#59654f"/>
    <circle cx="817" cy="306" r="4" fill="#59654f"/>
