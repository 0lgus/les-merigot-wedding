<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Merigot Wedding Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <div class="text-center mb-5">

        <h1 class="display-4">Les Merigot</h1>

        <p class="lead">
            Welcome to our wedding ❤️
        </p>

    </div>

    <div class="row g-4">

        <div class="col-md-6">

            <div class="card feature-card">

                <div class="card-body text-center">

                    <i class="bi bi-geo-alt feature-icon"></i>

                    <h3>Find My Seat</h3>

                    <p>
                        Find your table, seat and meal.
                    </p>

                    <a href="#" class="btn btn-success">
                        Open
                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card feature-card">

                <div class="card-body text-center">

                    <i class="bi bi-camera feature-icon"></i>

                    <h3>Share Photos</h3>

                    <p>
                        Upload your wedding photos.
                    </p>

                    <a href="#" class="btn btn-success">
                        Open
                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card feature-card">

                <div class="card-body text-center">

                    <i class="bi bi-globe feature-icon"></i>

                    <h3>Wedding Website</h3>

                    <p>
                        Timeline, FAQ and venue information.
                    </p>

                    <a href="#" class="btn btn-success">
                        Open
                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card feature-card">

                <div class="card-body text-center">

                    <i class="bi bi-whatsapp feature-icon"></i>

                    <h3>WhatsApp Group</h3>

                    <p>
                        Join the wedding chat.
                    </p>

                    <a href="#" class="btn btn-success">
                        Open
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
