<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400"
 role="img" aria-labelledby="title desc">
<title id="title">Olga &amp; Ben Wedding Seating Map</title>
<desc id="desc">Reception map with ten tables, dance area, DJ, bar and toilets.</desc>
<style>
:root {
 --ivory:#f8f6f1; --warm:#fffdf9; --sage:#78866b; --dark:#59654f;
 --light:#e7ebe2; --gold:#b79a62; --text:#34382f; --muted:#70766b;
}
.bg{fill:var(--ivory)}
.zone{fill:rgba(255,253,249,.55);stroke:var(--sage);stroke-width:3;stroke-dasharray:12 10}
.fixture{fill:var(--light);stroke:var(--dark);stroke-width:3}
.table-shape{fill:var(--warm);stroke:var(--dark);stroke-width:3}
.seat{fill:var(--warm);stroke:var(--sage);stroke-width:2.5}
.seat-label{fill:var(--text);font:500 17px Georgia,"Times New Roman",serif;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.table-label{fill:var(--dark);font:500 29px Georgia,"Times New Roman",serif;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.fixture-label{fill:var(--dark);font:600 21px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
.small-label{fill:var(--muted);font:500 17px Arial,sans-serif;text-anchor:middle}
.dance-label{fill:var(--dark);font:500 28px Georgia,"Times New Roman",serif;text-anchor:middle}
.table-group.is-active .table-shape{fill:#f4ead4;stroke:var(--gold);stroke-width:5}
.seat-group.is-active .seat{fill:var(--gold);stroke:var(--gold)}
.seat-group.is-active .seat-label{fill:white;font-weight:700}
</style>

<rect class="bg" width="1000" height="1400"/>

<!-- Dance floor -->
<g id="dance-area">
 <rect class="zone" x="285" y="75" width="455" height="220" rx="8"/>
 <text class="dance-label" x="512" y="195">Dance Area</text>
</g>

<!-- DJ -->
<g id="dj-stand">
 <rect class="fixture" x="798" y="300" width="48" height="70" rx="5"/>
 <circle cx="822" cy="319" r="11" fill="none" stroke="#59654f" stroke-width="2.5"/>
 <circle cx="822" cy="351" r="11" fill="none" stroke="#59654f" stroke-width="2.5"/>
 <circle cx="822" cy="319" r="3.5" fill="#59654f"/>
 <circle cx="822" cy="351" r="3.5" fill="#59654f"/>
 <text class="small-label" x="822" y="288">DJ</text>
</g>

<!-- Bar -->
<g id="bar">
 <rect class="fixture" x="780" y="405" width="85" height="300" rx="6"/>
 <text class="fixture-label" x="822.5" y="555">BAR</text>
</g>

